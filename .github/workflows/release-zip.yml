name: Build HACS Release ZIP

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current ref to read manifest
        uses: actions/checkout@v4

      - name: Determine release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            VERSION="$(python -c 'import json; print(json.load(open("custom_components/edgeos/manifest.json"))["version"])')"
            TAG="v$VERSION"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create versioned release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi

      - name: Check out the release tag before packaging
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Build integration ZIP
        run: |
          cd custom_components/edgeos
          zip -r "$GITHUB_WORKSPACE/edgeos.zip" .
          cd "$GITHUB_WORKSPACE"
          sha256sum edgeos.zip > edgeos.zip.sha256

      - name: Upload ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.release.outputs.tag }}" edgeos.zip edgeos.zip.sha256 --clobber
