name: Build HACS Release ZIP

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build integration ZIP
        run: |
          cd custom_components/edgeos
          zip -r "$GITHUB_WORKSPACE/edgeos.zip" .
          cd "$GITHUB_WORKSPACE"
          sha256sum edgeos.zip > edgeos.zip.sha256
      - name: Create versioned release if needed, then upload ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            VERSION="$(python -c 'import json; print(json.load(open("custom_components/edgeos/manifest.json"))["version"])')"
            TAG="v$VERSION"
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

          gh release upload "$TAG" edgeos.zip edgeos.zip.sha256 --clobber
